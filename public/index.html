
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Online Book Management System</h1>
            <p>Manage your book collection easily</p>
        </header>

        <div id="message" class="message" role="status"
             aria-live="polite"></div>

        <section class="form-section">
            <h2 id="form-title">Add New Book</h2>

            <form id="bookForm">

                <input type="hidden" id="bookId">

                <div class="form-group">
                    <label for="title">Book Title</label>
                    <input type="text" id="title"
                           placeholder="Enter book title" required>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author"
                           placeholder="Enter author name" required>
                </div>

                <div class="form-group">
                    <label for="price">Price (₹)</label>
                    <input type="number" id="price"
                           placeholder="Enter price" min="0"
                           step="0.01" required>
                </div>

                <button type="submit" id="submitBtn">
                    Add Book
                </button>

                <button type="button" id="cancelBtn"
                        class="cancel-btn" hidden>
                    Cancel
                </button>

            </form>
        </section>

        <section class="books-section">
            <h2>Available Books</h2>

            <div id="bookList" class="book-list">
                Loading books...
            </div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
